---
# Role: docker — install Docker Engine + Compose plugin via official repo.
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker apt repository (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    signed_by: /etc/apt/keyrings/docker.asc
    baseurl: 'https://download.docker.com/linux/ubuntu'
    suites: '{{ ansible_distribution_release }}'
    components: stable
    enabled: true
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add remote user to docker group (non-root container mgmt)
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    groups: docker
    append: true
  when: ansible_user != 'root'
